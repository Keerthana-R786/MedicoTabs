openapi: 3.1.0
info:
  title: Generate Referral Letter
  version: 1.0.0
  description: Create a formal referral letter document with patient and clinical information
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/generate-referral-letter:
    post:
      operationId: generateReferralLetter
      summary: Generate formal referral letter document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - patient_name
                - clinical_summary
                - requesting_provider
                - specialty_required
              properties:
                referral_id:
                  type: string
                  description: Referral identifier
                patient_name:
                  type: string
                  description: Full patient name
                clinical_summary:
                  type: string
                  description: Clinical information and diagnosis
                requesting_provider:
                  type: string
                  description: Name of referring physician
                requesting_organization:
                  type:
                    - string
                    - 'null'
                  description: Referring organization name
                specialty_required:
                  type: string
                  description: Specialty consultation requested
                urgency:
                  type:
                    - string
                    - 'null'
                  description: Urgency level
      responses:
        '200':
          description: Referral letter generated successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - referral_id
                  - letter_content
                  - generated_at
                properties:
                  referral_id:
                    type: string
                  letter_content:
                    type: string
                  document_id:
                    type:
                      - string
                      - 'null'
                  generated_at:
                    type: string
                  letter_format:
                    type:
                      - string
                      - 'null'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
