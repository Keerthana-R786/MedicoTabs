openapi: 3.1.0
info:
  title: Specialist Routing and Availability
  version: 1.0.0
  description: Checks same-specialty routing options and reroutes an unacknowledged referral to the next available specialist or on-call provider
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/specialist-routing-availability:
    post:
      operationId: specialistRoutingAvailability
      summary: Check same-specialty routing options and reroute eligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - specialty_type
              properties:
                referral_id:
                  type: string
                  description: Referral identifier or referral number
                specialty_type:
                  type: string
                  description: Requested specialty to search for
                preferred_specialist:
                  type: string
                  description: Preferred specialist name or facility
                current_specialist_id:
                  type: string
                  description: Currently routed specialist identifier
                urgency:
                  type: string
                  description: Referral urgency level
                check_type:
                  type: string
                  description: Routing check context, e.g. initial_routing or post_realert
      responses:
        '200':
          description: Routing availability determined
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - referral_id
                  - routing_status
                  - reroute_required
                properties:
                  referral_id:
                    type: string
                  specialty_type:
                    type: string
                  check_type:
                    type: string
                  routing_status:
                    type: string
                  reroute_required:
                    type: boolean
                  selected_specialist:
                    # Nullable: the handler returns null when no specialist
                    # in this specialty exists (alternatives[0] || null).
                    # Yoxa rejects a loose additionalProperties:true object,
                    # so this is fully typed instead — specialty/available
                    # are only present when this falls back to an
                    # alternatives[0] entry, not the preferredMatch branch.
                    type:
                      - object
                      - 'null'
                    additionalProperties: false
                    required:
                      - specialist_id
                      - specialist_name
                      - organization
                    properties:
                      specialist_id:
                        type: string
                      specialist_name:
                        type: string
                      organization:
                        type: string
                      specialty:
                        type: string
                      available:
                        type: boolean
                  alternatives_considered:
                    type: integer
                  alternatives:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - specialist_id
                        - specialist_name
                        - organization
                        - specialty
                        - available
                      properties:
                        specialist_id:
                          type: string
                        specialist_name:
                          type: string
                        organization:
                          type: string
                        specialty:
                          type: string
                        available:
                          type: boolean
                  urgency:
                    type: string
                  checked_at:
                    type: string
