openapi: 3.1.0
info:
  title: Get Specialist Availability
  version: 1.0.0
  description: Retrieve available appointment slots for specialist consultation
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/get-specialist-availability:
    post:
      operationId: getSpecialistAvailability
      summary: Check specialist scheduling availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - specialty_type
                - referral_id
              properties:
                specialty_type:
                  type: string
                  description: Type of specialty required
                referral_id:
                  type: string
                  description: Referral identifier
                preferred_date_range:
                  type:
                    - string
                    - 'null'
                  description: Preferred date range for appointment
                urgency:
                  type:
                    - string
                    - 'null'
                  description: Urgency level
      responses:
        '200':
          description: Specialist availability retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - referral_id
                  - specialists_available
                properties:
                  referral_id:
                    type: string
                  specialists_available:
                    type: array
                    items:
                      type: object
                      properties:
                        specialist_id:
                          type: string
                        specialist_name:
                          type: string
                        organization:
                          type: string
                        specialty:
                          type: string
                        available_slots:
                          type: array
                          items:
                            type: object
                            properties:
                              slot_id:
                                type: string
                              date:
                                type: string
                              time:
                                type: string
                              duration_minutes:
                                type: integer

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
