openapi: 3.1.0
info:
  title: Get Patient Data
  version: 1.0.0
  description: Retrieve patient demographics, medical history, and clinical information for referral processing
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/get-patient-data:
    post:
      operationId: getPatientData
      summary: Retrieve comprehensive patient information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - patient_id
              properties:
                patient_id:
                  type: string
                  description: Unique identifier for the patient
                include_documents:
                  type: boolean
                  description: Whether to include document references
      responses:
        '200':
          description: Patient data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - patient_id
                  - first_name
                  - last_name
                  - date_of_birth
                  - gender
                properties:
                  patient_id:
                    type: string
                  referral_id:
                    type:
                      - string
                      - 'null'
                  first_name:
                    type: string
                  last_name:
                    type: string
                  date_of_birth:
                    type: string
                  gender:
                    type: string
                  contact_number:
                    type: string
                  email:
                    type: string
                  address:
                    type: string
                  insurance_provider:
                    type: string
                  insurance_id:
                    type:
                      - string
                      - 'null'
                  medical_history:
                    type: string
                  allergies:
                    type: string
                  current_medications:
                    type: string
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id:
                          type: string
                        file_name:
                          type: string
                        category:
                          type: string

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
