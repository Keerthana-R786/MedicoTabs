openapi: 3.1.0
info:
  title: Generate Prior Authorization
  version: 1.0.0
  description: Create and submit prior authorization request to insurance provider
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/generate-prior-auth:
    post:
      operationId: generatePriorAuth
      summary: Generate prior authorization request document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - patient_id
                - insurance_provider
                - procedure_code
              properties:
                referral_id:
                  type: string
                  description: Referral identifier
                patient_id:
                  type: string
                  description: Patient identifier
                insurance_provider:
                  type: string
                  description: Insurance company name
                insurance_id:
                  type:
                    - string
                    - 'null'
                  description: Patient insurance member ID
                procedure_code:
                  type: string
                  description: CPT or procedure code requiring authorization
                clinical_justification:
                  type:
                    - string
                    - 'null'
                  description: Medical necessity justification
                diagnosis_codes:
                  type: array
                  items:
                    type: string
                  description: ICD diagnosis codes
      responses:
        '200':
          description: Prior authorization request generated successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - auth_request_id
                  - referral_id
                  - status
                  - submitted_at
                properties:
                  auth_request_id:
                    type: string
                  referral_id:
                    type: string
                  patient_id:
                    type:
                      - string
                      - 'null'
                  status:
                    type: string
                  reference_number:
                    type:
                      - string
                      - 'null'
                  submitted_at:
                    type: string
                  estimated_response_time:
                    type:
                      - string
                      - 'null'
                  request_document_id:
                    type:
                      - string
                      - 'null'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
