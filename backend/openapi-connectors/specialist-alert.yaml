openapi: 3.1.0
info:
  title: Specialist Alert
  version: 1.0.0
  description: Sends the distinct specialist intake alert or one permitted automatic re-alert with the referral urgency and acknowledgment deadline
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/specialist-alert:
    post:
      operationId: specialistAlert
      summary: Send specialist intake alert with urgency and acknowledgment deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - specialist_id
                - patient_name
                - urgency_level
              properties:
                referral_id:
                  type: string
                  description: Referral identifier
                specialist_id:
                  type: string
                  description: Specialist identifier
                specialist_name:
                  type:
                    - string
                    - 'null'
                  description: Specialist full name
                patient_name:
                  type: string
                  description: Patient full name
                patient_id:
                  type:
                    - string
                    - 'null'
                  description: Patient identifier
                urgency_level:
                  type: string
                  description: Urgency level
                specialty_type:
                  type:
                    - string
                    - 'null'
                  description: Requested specialty type
                referral_reason:
                  type:
                    - string
                    - 'null'
                  description: Referral reason or diagnosis
                acknowledgment_deadline:
                  type:
                    - string
                    - 'null'
                  description: Acknowledgment deadline from the Urgency SLA Calculator
      responses:
        '200':
          description: Specialist intake alert delivered to intake queue and specialist
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - alert_id
                  - referral_id
                  - specialist_id
                  - status
                properties:
                  alert_id:
                    type: string
                  referral_id:
                    type: string
                  specialist_id:
                    type: string
                  status:
                    type: string
                  alert_sent_at:
                    type:
                      - string
                      - 'null'
                  notification_channels:
                    type: array
                    items:
                      type: string
                  delivery_confirmed:
                    type: boolean
                  acknowledgment_required_by:
                    type:
                      - string
                      - 'null'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
