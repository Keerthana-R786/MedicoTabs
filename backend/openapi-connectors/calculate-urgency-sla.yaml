openapi: 3.1.0
info:
  title: Calculate Urgency SLA
  version: 1.0.0
  description: "Determines the required response window based on the referral's urgency level and writes it into the Flight Tracker as a persistent SLA deadline for downstream steps to reference. Emergency: 30 min, Urgent: 4 h, Routine: 24 h."
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/calculate-urgency-sla:
    post:
      operationId: calculateUrgencySla
      summary: Calculate and persist SLA deadline as single source of truth for downstream timing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - urgency_level
              properties:
                referral_id:
                  type: string
                  description: Referral identifier
                urgency_level:
                  type: string
                  description: "Urgency level - Emergency (30 min), Urgent (4 h), or Routine (24 h)"
                  enum:
                    - Emergency
                    - Urgent
                    - Routine
                referral_created_at:
                  type:
                    - string
                    - 'null'
                  description: Timestamp when referral was created
                specialty_type:
                  type:
                    - string
                    - 'null'
                  description: Type of specialist consultation
      responses:
        '200':
          description: SLA deadline calculated successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - referral_id
                  - urgency_level
                  - sla_deadline
                  - priority_score
                properties:
                  referral_id:
                    type: string
                  urgency_level:
                    type: string
                  sla_deadline:
                    type: string
                    description: "ISO 8601 timestamp for the SLA deadline, the single source of truth for all downstream alert, escalation, and nudge timing"
                  priority_score:
                    type: integer
                    description: Priority score (1-10, 10 being highest)
                  time_remaining_hours:
                    type: integer
                    description: Hours remaining until SLA breach
                  acknowledgment_deadline:
                    type:
                      - string
                      - 'null'
                    description: Deadline for specialist to acknowledge
                  escalation_required:
                    type: boolean
                    description: Whether immediate escalation is needed
                  calculated_at:
                    type:
                      - string
                      - 'null'
                    description: Timestamp when calculation was performed

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
