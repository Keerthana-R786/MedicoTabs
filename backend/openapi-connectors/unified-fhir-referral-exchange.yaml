openapi: 3.1.0
info:
  title: Unified FHIR Referral Exchange
  version: 1.0.0
  description: Creates, routes, and retrieves confirmed referral and acknowledgment data for in-network and external specialist pathways through one FHIR-based process
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/unified-fhir-referral-exchange:
    post:
      operationId: unifiedFhirReferralExchange
      summary: Create, route, and confirm referral through the unified FHIR exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - patient_id
                - requesting_provider
                - receiving_provider
              properties:
                referral_id:
                  type: string
                  description: Referral identifier
                patient_id:
                  type: string
                  description: Patient identifier
                requesting_provider:
                  type: string
                  description: Referring provider identifier
                requesting_organization:
                  type:
                    - string
                    - 'null'
                  description: Referring organization name
                receiving_provider:
                  type: string
                  description: Specialist provider identifier
                receiving_organization:
                  type:
                    - string
                    - 'null'
                  description: Receiving organization name
                clinical_summary:
                  type:
                    - string
                    - 'null'
                  description: Clinical summary for the referral
                urgency:
                  type:
                    - string
                    - 'null'
                  description: Urgency level (Emergency, Urgent, or Routine)
                specialty:
                  type:
                    - string
                    - 'null'
                  description: Requested specialty
      responses:
        '200':
          description: FHIR referral transaction created successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - transaction_id
                  - referral_id
                  - fhir_bundle_id
                  - status
                properties:
                  transaction_id:
                    type: string
                  referral_id:
                    type: string
                  patient_id:
                    type:
                      - string
                      - 'null'
                    description: Patient identifier, echoed back for downstream stages to reference
                  patient_name:
                    type:
                      - string
                      - 'null'
                    description: Patient full name, echoed back for downstream stages to reference
                  patient_email:
                    type:
                      - string
                      - 'null'
                    description: Patient email address, echoed back for downstream stages to reference (e.g. the final patient delivery step)
                  fhir_bundle_id:
                    type: string
                  fhir_version:
                    type:
                      - string
                      - 'null'
                  status:
                    type: string
                  created_at:
                    type:
                      - string
                      - 'null'
                  exchange_endpoint:
                    type:
                      - string
                      - 'null'
                  transaction_signed:
                    type: boolean

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
