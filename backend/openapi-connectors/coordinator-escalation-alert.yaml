openapi: 3.1.0
info:
  title: Coordinator Escalation Alert
  version: 1.0.0
  description: Send escalation alert to care coordinator for high-priority referrals requiring immediate attention
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/coordinator-escalation-alert:
    post:
      operationId: coordinatorEscalationAlert
      summary: Alert care coordinator for urgent referral escalation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - urgency_level
                - escalation_reason
              properties:
                referral_id:
                  type: string
                  description: Referral identifier
                patient_id:
                  type: string
                  description: Patient identifier
                patient_name:
                  type: string
                  description: Patient full name
                urgency_level:
                  type: string
                  # The handler never restricts this value, and escalations
                  # can legitimately fire for a Routine referral (e.g. a
                  # non-responsive doctor sign-off or failed EHR archival) —
                  # restricting to Emergency/Urgent rejected valid requests.
                  description: Urgency level of the referral being escalated
                escalation_reason:
                  type: string
                  description: Reason for coordinator escalation
                specialty_required:
                  type: string
                  description: Specialty consultation needed
                sla_deadline:
                  type: string
                  description: SLA deadline timestamp
                coordinator_id:
                  type: string
                  description: Assigned care coordinator ID
      responses:
        '200':
          description: Escalation alert sent successfully to coordinator
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - alert_id
                  - referral_id
                  - coordinator_notified
                  - status
                properties:
                  alert_id:
                    type: string
                  referral_id:
                    type: string
                  coordinator_id:
                    type: string
                  coordinator_notified:
                    type: boolean
                  status:
                    type: string
                  alert_sent_at:
                    type: string
                  notification_channels:
                    type: array
                    items:
                      type: string
                    description: Channels used (email, sms, pager)
                  acknowledgment_required:
                    type: boolean

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
