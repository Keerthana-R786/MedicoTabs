openapi: 3.1.0
info:
  title: Patient Re-engagement Nudge
  version: 1.0.0
  description: Sends a distinct urgency-adjusted SMS, email, or call prompt to help a patient re-engage or reschedule after a missed or unconfirmed visit
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/patient-reengagement-nudge:
    post:
      operationId: patientReengagementNudge
      summary: Send urgency-adjusted re-engagement prompt after missed or unconfirmed visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - patient_id
                - referral_id
                - nudge_type
              properties:
                patient_id:
                  type: string
                  description: Patient identifier
                referral_id:
                  type: string
                  description: Associated referral identifier
                nudge_type:
                  type: string
                  description: Type of re-engagement
                  enum:
                    - missed_appointment
                    - pending_scheduling
                    - incomplete_paperwork
                    - follow_up_required
                message_content:
                  type:
                    - string
                    - 'null'
                  description: Personalized reminder message
                appointment_id:
                  type:
                    - string
                    - 'null'
                  description: Related appointment if applicable
                delivery_method:
                  type:
                    - string
                    - 'null'
                  description: Preferred contact method
                  enum:
                    - email
                    - sms
                    - phone
                    - portal
      responses:
        '200':
          description: Urgency-adjusted re-engagement nudge delivered to patient
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - nudge_id
                  - patient_id
                  - status
                properties:
                  nudge_id:
                    type: string
                  patient_id:
                    type: string
                  referral_id:
                    type:
                      - string
                      - 'null'
                  status:
                    type: string
                  sent_at:
                    type:
                      - string
                      - 'null'
                  delivery_method:
                    type:
                      - string
                      - 'null'
                  delivery_status:
                    type:
                      - string
                      - 'null'
                  next_nudge_scheduled:
                    type:
                      - string
                      - 'null'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
