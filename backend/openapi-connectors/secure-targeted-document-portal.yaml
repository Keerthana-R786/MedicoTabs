openapi: 3.1.0
info:
  title: Secure Targeted Document Portal
  version: 1.0.0
  description: Opens a secure consultation-specific portal for requesting, selecting, uploading, and confirming only the records needed for the referral
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/secure-targeted-document-portal:
    post:
      operationId: secureTargetedDocumentPortal
      summary: Open consultation-specific portal for targeted document exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - document_ids
                - recipient_id
              properties:
                referral_id:
                  type: string
                  description: Associated referral identifier
                patient_id:
                  type:
                    - string
                    - 'null'
                  description: Patient identifier
                document_ids:
                  type: array
                  items:
                    type: string
                  description: List of document IDs to share
                recipient_id:
                  type: string
                  description: Receiving provider identifier
                sender_id:
                  type:
                    - string
                    - 'null'
                  description: Sending provider identifier
                access_expiration:
                  type:
                    - string
                    - 'null'
                  description: When portal access expires
                require_acknowledgment:
                  type: boolean
                  description: Whether recipient must acknowledge receipt
      responses:
        '200':
          description: Secure consultation-specific portal opened with targeted document packet
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - portal_session_id
                  - referral_id
                  - status
                properties:
                  portal_session_id:
                    type: string
                  referral_id:
                    type: string
                  documents_shared:
                    type: integer
                  status:
                    type: string
                  portal_url:
                    type:
                      - string
                      - 'null'
                  access_token:
                    type:
                      - string
                      - 'null'
                  shared_at:
                    type:
                      - string
                      - 'null'
                  expires_at:
                    type:
                      - string
                      - 'null'
                  encryption_enabled:
                    type: boolean

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
