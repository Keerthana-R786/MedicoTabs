openapi: 3.1.0
info:
  title: Send Secure Message
  version: 1.0.0
  description: Send secure message between healthcare providers regarding referral
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/send-secure-message:
    post:
      operationId: sendSecureMessage
      summary: Send encrypted message between providers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - sender_id
                - recipient_id
                - message_content
              properties:
                referral_id:
                  type: string
                  description: Associated referral identifier
                sender_id:
                  type: string
                  description: Sending provider identifier
                recipient_id:
                  type: string
                  description: Receiving provider identifier
                message_content:
                  type: string
                  description: Message body content
                message_type:
                  type: string
                  description: Type of message (query, update, clarification)
                priority:
                  type: string
                  description: Message priority level
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - message_id
                  - referral_id
                  - status
                  - sent_at
                properties:
                  message_id:
                    type: string
                  referral_id:
                    type: string
                  sender_id:
                    type: string
                  recipient_id:
                    type: string
                  status:
                    type: string
                  sent_at:
                    type: string
                  delivery_status:
                    type: string
