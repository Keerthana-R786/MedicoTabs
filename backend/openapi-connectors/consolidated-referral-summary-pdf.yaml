openapi: 3.1.0
info:
  title: Consolidated Referral Summary PDF
  version: 1.0.0
  description: Generates the standardized medical history PDF containing the complete confirmed referral journey, tracker audit trail, final urgency, and financial status
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/consolidated-referral-summary-pdf:
    post:
      operationId: consolidatedReferralSummaryPdf
      summary: Generate the standardized consolidated referral summary PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - patient_id
              properties:
                referral_id:
                  type: string
                  description: Referral identifier or referral number
                patient_id:
                  type: string
                  description: Patient identifier
                patient_name:
                  type:
                    - string
                    - 'null'
                  description: Patient full name
                document_title:
                  type:
                    - string
                    - 'null'
                  description: Output file name for the PDF
                journey_summary:
                  type:
                    - string
                    - 'null'
                  description: Complete confirmed referral journey narrative
                tracker_audit_trail:
                  type:
                    - string
                    - 'null'
                  description: Flight tracker audit trail entries
                final_urgency:
                  type:
                    - string
                    - 'null'
                  description: Final urgency level of the referral
                financial_status:
                  type:
                    - string
                    - 'null'
                  description: Final coverage and co-pay status
                authored_by:
                  type:
                    - string
                    - 'null'
                  description: User identifier of the signing doctor
      responses:
        '200':
          description: Summary PDF generated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - document_id
                  - referral_id
                  - status
                properties:
                  document_id:
                    type: string
                  referral_id:
                    type: string
                  referral_number:
                    type:
                      - string
                      - 'null'
                  patient_id:
                    type:
                      - string
                      - 'null'
                  document_reference_id:
                    type:
                      - string
                      - 'null'
                  fhir_resource_id:
                    type:
                      - string
                      - 'null'
                  file_name:
                    type:
                      - string
                      - 'null'
                  output_type:
                    type:
                      - string
                      - 'null'
                  content_length:
                    type: integer
                  status:
                    type: string
                  generated_at:
                    type:
                      - string
                      - 'null'
                  eligible_for_attachment:
                    type: boolean

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
