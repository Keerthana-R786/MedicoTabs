openapi: 3.1.0
info:
  title: Coverage and Pre-approval Verification
  version: 1.0.0
  description: Applies the routine-visit exemption or verifies eligibility, pre-approval requirements, and expected co-pay for services that require coverage verification
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/coverage-preapproval-verification:
    post:
      operationId: coveragePreapprovalVerification
      summary: Verify eligibility and pre-approval requirements for the referred service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - referral_id
                - patient_id
              properties:
                referral_id:
                  type: string
                  description: Referral identifier or referral number
                patient_id:
                  type: string
                  description: Patient identifier
                service_type:
                  type: string
                  description: Requested service, e.g. consultation, endoscopic evaluation
                specialty_type:
                  type: string
                  description: Requested specialty
      responses:
        '200':
          description: Coverage verification completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - referral_id
                  - is_eligible
                  - coverage_status
                properties:
                  referral_id:
                    type: string
                  patient_id:
                    type: string
                  insurance_provider:
                    type: string
                  member_id:
                    type: string
                  routine_visit_exempt:
                    type: boolean
                  is_eligible:
                    type: boolean
                  coverage_status:
                    type: string
                  pre_approval_required:
                    type: boolean
                  pre_approval_status:
                    type: string
                  pre_approval_number:
                    type: string
                  expected_copay:
                    type: number
                  coverage_details:
                    type: string
                  verified_at:
                    type: string

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
