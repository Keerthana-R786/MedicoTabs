openapi: 3.1.0
info:
  title: Notify Patient
  version: 1.0.0
  description: Send notification to patient about referral status or appointment
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/notify-patient:
    post:
      operationId: notifyPatient
      summary: Send patient notification via preferred channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - patient_id
                - referral_id
                - notification_type
                - message_content
              properties:
                patient_id:
                  type: string
                  description: Patient identifier
                referral_id:
                  type: string
                  description: Referral identifier
                notification_type:
                  type: string
                  description: Type of notification (appointment, status_update, reminder)
                message_content:
                  type: string
                  description: Notification message body
                delivery_method:
                  type: string
                  description: Preferred delivery method (email, sms, portal)
                appointment_details:
                  type: object
                  properties:
                    specialist_name:
                      type: string
                    date:
                      type: string
                    time:
                      type: string
                    location:
                      type: string
      responses:
        '200':
          description: Patient notification sent successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - notification_id
                  - patient_id
                  - status
                  - sent_at
                properties:
                  notification_id:
                    type: string
                  patient_id:
                    type: string
                  referral_id:
                    type: string
                  status:
                    type: string
                  delivery_method:
                    type: string
                  sent_at:
                    type: string
                  delivery_status:
                    type: string
