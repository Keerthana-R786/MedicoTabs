openapi: 3.1.0
info:
  title: EHR DocumentReference Save
  version: 1.0.0
  description: Saves the generated PDF as a FHIR DocumentReference attachment in the patient's existing EHR record folder and returns persistence evidence
servers:
  - url: https://medicotabs.onrender.com
paths:
  /api/yoxa/ehr-documentreference-save:
    post:
      operationId: ehrDocumentreferenceSave
      summary: Save PDF as FHIR DocumentReference attachment to patient EHR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - patient_id
                - referral_id
                - document_content
                - document_type
              properties:
                patient_id:
                  type: string
                  description: Patient identifier
                referral_id:
                  type: string
                  description: Referral identifier
                document_content:
                  type: string
                  description: Complete document content to persist in the EHR
                document_type:
                  type: string
                  description: Type of document
                  enum:
                    - referral_summary
                    - consultation_report
                    - workflow_completion
                    - clinical_notes
                document_title:
                  type:
                    - string
                    - 'null'
                  description: Document title
                authored_by:
                  type:
                    - string
                    - 'null'
                  description: Provider who authored document
                document_date:
                  type:
                    - string
                    - 'null'
                  description: Document creation date
                specialty:
                  type:
                    - string
                    - 'null'
                  description: Associated specialty
                confidentiality:
                  type:
                    - string
                    - 'null'
                  description: Confidentiality level
                  enum:
                    - normal
                    - restricted
                    - very_restricted
      responses:
        '200':
          description: FHIR DocumentReference saved to patient EHR with persistence evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - document_id
                  - patient_id
                  - status
                  - saved_at
                properties:
                  document_id:
                    type: string
                  patient_id:
                    type: string
                  referral_id:
                    type:
                      - string
                      - 'null'
                  document_reference_id:
                    type:
                      - string
                      - 'null'
                  status:
                    type: string
                  saved_at:
                    type: string
                  ehr_location:
                    type:
                      - string
                      - 'null'
                  fhir_resource_id:
                    type:
                      - string
                      - 'null'
                  indexed:
                    type: boolean

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
